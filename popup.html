<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SubText</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-glyph">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="3" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <line x1="5" y1="7" x2="11" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="5" y1="10" x2="9" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="brand-name">subtext</span>
        <span class="version-tag">1.0</span>
      </div>
      <div class="status-indicator" id="status-indicator">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-label" id="status-label">scanning</span>
      </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content">
      <!-- Target Video Card -->
      <section class="card video-card" id="video-card">
        <div class="card-header-row">
          <span class="section-tag">TARGET</span>
          <span class="video-id-badge" id="video-id">----</span>
        </div>
        <div class="video-title" id="video-title">Detecting active YouTube tab...</div>
        <div class="video-channel" id="video-channel"></div>
      </section>

      <!-- Subtitle Controls (shown when video detected) -->
      <section class="controls-section" id="controls-section" style="display: none;">
        <!-- Track Selector -->
        <div class="field-block">
          <div class="field-header">
            <label class="field-label" for="track-select">TRACK</label>
            <span class="field-sub" id="tracks-count">0 tracks</span>
          </div>
          <div class="select-container">
            <select id="track-select" class="mono-select"></select>
            <div class="select-arrow">
              <svg width="10" height="6" viewBox="0 0 10 6" fill="none">
                <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- Format Selector -->
        <div class="field-block">
          <div class="field-header">
            <label class="field-label">FORMAT</label>
          </div>
          <div class="segmented-control" id="format-selector">
            <button class="seg-btn active" data-format="txt-prose">
              <span class="seg-label">prose</span>
              <span class="seg-ext">.txt</span>
            </button>
            <button class="seg-btn" data-format="txt-lines">
              <span class="seg-label">lines</span>
              <span class="seg-ext">.txt</span>
            </button>
            <button class="seg-btn" data-format="txt-stamps">
              <span class="seg-label">timed</span>
              <span class="seg-ext">.txt</span>
            </button>
            <button class="seg-btn" data-format="srt">
              <span class="seg-label">subrip</span>
              <span class="seg-ext">.srt</span>
            </button>
          </div>
        </div>

        <!-- Subtitle Metrics Bar -->
        <div class="metrics-bar" id="metrics-bar">
          <div class="metric-item">
            <span class="metric-val" id="metric-words">0</span>
            <span class="metric-dim">words</span>
          </div>
          <span class="metric-sep">/</span>
          <div class="metric-item">
            <span class="metric-val" id="metric-chars">0</span>
            <span class="metric-dim">chars</span>
          </div>
          <span class="metric-sep">/</span>
          <div class="metric-item">
            <span class="metric-val" id="metric-segs">0</span>
            <span class="metric-dim">segments</span>
          </div>
        </div>

        <!-- Live Preview Terminal -->
        <div class="preview-panel">
          <div class="preview-bar">
            <div class="preview-bar-left">
              <span class="terminal-dot"></span>
              <span class="preview-title">TRANSCRIPT PREVIEW</span>
            </div>
            <button id="toggle-preview-btn" class="ghost-btn">collapse</button>
          </div>
          <pre id="preview-text" class="preview-viewport">Fetching transcript...</pre>
        </div>

        <!-- Action Buttons -->
        <div class="actions-grid">
          <button id="download-btn" class="btn btn-primary">
            <svg class="btn-svg" width="13" height="13" viewBox="0 0 16 16" fill="none">
              <path d="M8 2V11M8 11L4.5 7.5M8 11L11.5 7.5M2 14H14" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="download-btn-label">DOWNLOAD .TXT</span>
          </button>
          <button id="copy-btn" class="btn btn-secondary">
            <svg class="btn-svg" width="13" height="13" viewBox="0 0 16 16" fill="none">
              <rect x="5" y="5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M3 11V3.5C3 3.22386 3.22386 3 3.5 3H11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span id="copy-btn-label">COPY</span>
          </button>
        </div>
      </section>

      <!-- Empty / Disconnected State -->
      <section class="card empty-card" id="empty-state" style="display: none;">
        <div class="empty-graphic">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="4" width="20" height="16" rx="3" stroke="#484f5d" stroke-width="1.5"/>
            <path d="M9 10L15 14L9 18V10Z" stroke="#484f5d" stroke-width="1.5" stroke-linejoin="round"/>
            <line x1="2" y1="2" x2="22" y2="22" stroke="#484f5d" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="empty-title" id="empty-title">No Video Detected</div>
        <div class="empty-desc" id="empty-desc">
          Navigate to an active YouTube video watch page to extract captions.
        </div>
        <button id="reload-tab-btn" class="btn btn-secondary btn-full" style="display: none;">
          RELOAD ACTIVE TAB
        </button>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span class="footer-tagline">subtext // transcript engine</span>
      <span class="footer-shortcut">ESC TO CLOSE</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
